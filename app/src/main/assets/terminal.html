<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="stylesheet" href="vendor/xterm.css">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #0E1116;
      overflow: hidden;
    }
    /* A small inset, or the first character of every line sits flush against
       the edge of the screen. FitAddon measures this element, so insetting it
       costs a column, not a clipped one. */
    #term {
      position: absolute;
      inset: 4px 6px;
    }
    /* xterm's hidden textarea is an IME target. This app's prompt is a native
       EditText. If this field can take focus, Gboard types into the pane. */
    .xterm-helper-textarea,
    textarea {
      pointer-events: none !important;
      opacity: 0 !important;
    }
  </style>
</head>
<body>
  <div id="term"></div>
  <script src="vendor/xterm.js"></script>
  <script src="vendor/addon-fit.js"></script>
  <script src="vendor/addon-unicode11.js"></script>
  <script src="vendor/addon-canvas.js"></script>
  <script>
    const term = new Terminal({
      disableStdin: true,
      convertEol: false,
      fontSize: 13,
      fontFamily: 'monospace',
      theme: { background: '#0E1116', foreground: '#E6EDF3', cursor: '#5FA8F5' },
      scrollback: 8000,
      cursorBlink: false,
      allowProposedApi: true
    });
    if (window.Unicode11Addon) {
      term.loadAddon(new Unicode11Addon.Unicode11Addon());
      term.unicode.activeVersion = '11';
    }
    const fit = new FitAddon.FitAddon();
    term.loadAddon(fit);
    term.open(document.getElementById('term'));
    if (window.CanvasAddon) {
      try { term.loadAddon(new CanvasAddon.CanvasAddon()); } catch (e) {}
    }
    const lockTextarea = () => {
      document.querySelectorAll('textarea').forEach((ta) => {
        ta.setAttribute('readonly', 'true');
        ta.setAttribute('disabled', 'true');
        ta.tabIndex = -1;
        ta.blur();
      });
    };
    lockTextarea();
    document.addEventListener('focusin', (e) => {
      if (e.target && e.target.tagName === 'TEXTAREA') {
        e.target.blur();
        lockTextarea();
      }
    });
    /* How many whole rows a drag has earned, and what is left over. Pure, so
       tools/terminal_check.js can cover the arithmetic without a browser. */
    window.termScrollStep = (accumPx, rowPx) => {
      if (!(rowPx > 0)) return { lines: 0, rest: accumPx };
      const lines = Math.trunc(accumPx / rowPx);
      return { lines: lines, rest: accumPx - lines * rowPx };
    };

    /* Touch scrolling, which xterm does not do for us.
     *
     * xterm draws .xterm-screen on top of .xterm-viewport, so a finger lands
     * on the screen, and the nearest scrollable ancestor of that is body,
     * which is overflow:hidden. On a desktop the pane still scrolls, because
     * xterm listens for wheel events and moves the buffer itself. A touch
     * produces no wheel, so nothing translated the gesture and the pane would
     * not move at all: measured on a device with 300 lines of output, a flick
     * and a slow drag, and byte-identical screenshots either way.
     *
     * One finger, one row per row-height dragged, no momentum. Predictable
     * beats clever on a pane someone is trying to read. Dragging down goes
     * back through the scrollback, the way a page does. */
    (() => {
      const el = term.element || document.getElementById('term');
      if (!el) return;
      let lastY = null;
      let accum = 0;
      const rowPx = () => {
        const h = el.clientHeight;
        return term.rows > 0 && h > 0 ? h / term.rows : 0;
      };
      const stop = () => { lastY = null; accum = 0; };
      el.addEventListener('touchstart', (e) => {
        if (e.touches.length !== 1) return stop();
        lastY = e.touches[0].clientY;
        accum = 0;
      }, { passive: true });
      el.addEventListener('touchmove', (e) => {
        if (lastY === null || e.touches.length !== 1) return;
        const y = e.touches[0].clientY;
        accum += lastY - y;
        lastY = y;
        const step = window.termScrollStep(accum, rowPx());
        accum = step.rest;
        if (step.lines !== 0) term.scrollLines(step.lines);
      }, { passive: true });
      el.addEventListener('touchend', stop, { passive: true });
      el.addEventListener('touchcancel', stop, { passive: true });
    })();

    const reportSize = () => {
      fit.fit();
      lockTextarea();
      if (window.CliqueBridge) {
        CliqueBridge.onSize(term.cols, term.rows);
      }
    };
    window.termWrite = (b64) => {
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      term.write(bytes);
    };
    window.termFit = reportSize;
    /* Last n rows ending at the cursor, scrollback included. Read-only:
       no scroll, no focus, no selection. Mirrors the panel's paneLastLines
       and TermText.lastLines. */
    /* The last n rows ending at the cursor, scrollback included, handed back
       through CliqueBridge as a plain string. Not returned: a value returned
       from here comes back to Kotlin as a JSON literal that would have to be
       decoded, and the bridge takes a real String with nothing to escape.
       Reads the buffer only: no scrolling, no focus, no selection, so asking
       for the text never moves the pane under someone's finger. */
    window.termText = (n) => {
      let out = "";
      try {
        n = n | 0;
        if (term && term.buffer && term.buffer.active && n > 0) {
          const buf = term.buffer.active;
          const lines = [];
          for (let y = buf.baseY + buf.cursorY; y >= 0 && lines.length < n; y--) {
            const line = buf.getLine(y);
            lines.unshift(line ? line.translateToString(true) : "");
          }
          out = lines.join("\n").replace(/\s+$/, "");
        }
      } catch (e) {
        out = "";
      }
      if (window.CliqueBridge) CliqueBridge.onText(out);
    };
    window.onresize = reportSize;
    setTimeout(() => {
      reportSize();
      if (window.CliqueBridge) CliqueBridge.onReady(term.cols, term.rows);
    }, 50);
  </script>
</body>
</html>
